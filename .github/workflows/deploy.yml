name: "Deploy PWA to GitHub Pages"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pwa:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Inject GitHub Pages baseUrl & Export Web PWA
        run: |
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('app.json')); a.expo.experiments={...a.expo.experiments, baseUrl:'/money-honey'}; fs.writeFileSync('app.json', JSON.stringify(a,null,2));"
          npx expo export --platform web

      - name: Configure GitHub Pages Routing (.nojekyll & 404 fallback & PWA files)
        run: |
          touch dist/.nojekyll
          if [ -f dist/index.html ]; then cp dist/index.html dist/404.html; fi
          cp -r public/* dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
