name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Release APK via Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 🚀 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Money-Honey-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📦 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Money-Honey Android Release v1.0.0"
          body: "Official standalone release APK for Money-Honey Android mobile application. Direct installer for mobile devices."
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
