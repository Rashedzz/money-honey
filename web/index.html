<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <title>Money-Honey — Private Wealth & Bangladesh Stock AI</title>

    <!-- Theme & App Description -->
    <meta name="theme-color" content="#0284C7" />
    <meta name="description" content="Smart personal wealth, investments & Bangladesh DSE stock market AI suite" />
    <meta name="application-name" content="Money-Honey" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Money-Honey" />

    <!-- PWA Web App Manifest & Icons (Relative for GitHub Pages subpath support) -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <!-- React Native Web layout reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #E0F2FE;
      }
      body {
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* High-Visibility Custom Vertical Scrollbars (Especially Left Sidebar) */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #16A34A; /* Money-Honey Green on hover */
      }
    </style>

    <!-- Register PWA Service Worker for Browser Install Icon in Search Bar -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var swUrl = './sw.js';
          navigator.serviceWorker.register(swUrl).then(function(reg) {
            console.log('Money-Honey PWA Service Worker registered:', reg.scope);
          }).catch(function(err) {
            console.warn('PWA Service Worker registration failed:', err);
          });
        });
      }

      // Capture beforeinstallprompt for instant 1-click install button in browser
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.log('beforeinstallprompt captured — browser install banner ready!');
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run Money-Honey Wealth Suite.
    </noscript>
    <div id="root"></div>
  </body>
</html>
